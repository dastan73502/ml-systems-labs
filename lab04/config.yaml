seed: 42

source:
  name: adult
  version: 2
  target_raw: class
  target: income
  positive_label: ">50K"

paths:
  raw: data/raw/adult_raw.csv
  processed_dir: data/processed
  results: results

expected:
  rows: 48842
  columns: 15

split:
  test_size: 0.3
  stratify: true

cleaning:
  numeric_impute: median
  categorical_impute: most_frequent
  clip_quantiles: [0.01, 0.99]
  drop_train_duplicates: true

features:
  derived: [capital_net, hours_per_age]

baseline:
  model: LogisticRegression
  max_iter: 2000
  C: 1.0

label_audit:
  sample_size: 50

schema:
  missing_token: "?"
  columns:
    age: {type: int, min: 17, max: 90}
    workclass:
      type: category
      allowed: ["Private", "Self-emp-not-inc", "Self-emp-inc", "Federal-gov", "Local-gov", "State-gov", "Without-pay", "Never-worked", "?"]
    fnlwgt: {type: int}
    education:
      type: category
      allowed: ["Bachelors", "Some-college", "11th", "HS-grad", "Prof-school", "Assoc-acdm", "Assoc-voc", "9th", "7th-8th", "12th", "Masters", "1st-4th", "10th", "Doctorate", "5th-6th", "Preschool", "?"]
    education-num: {type: int, min: 1, max: 16}
    marital-status:
      type: category
      allowed: ["Married-civ-spouse", "Divorced", "Never-married", "Separated", "Widowed", "Married-spouse-absent", "Married-AF-spouse", "?"]
    occupation:
      type: category
      allowed: ["Tech-support", "Craft-repair", "Other-service", "Sales", "Exec-managerial", "Prof-specialty", "Handlers-cleaners", "Machine-op-inspct", "Adm-clerical", "Farming-fishing", "Transport-moving", "Priv-house-serv", "Protective-serv", "Armed-Forces", "?"]
    relationship:
      type: category
      allowed: ["Wife", "Own-child", "Husband", "Not-in-family", "Other-relative", "Unmarried", "?"]
    race:
      type: category
      allowed: ["White", "Asian-Pac-Islander", "Amer-Indian-Eskimo", "Other", "Black", "?"]
    sex:
      type: category
      allowed: ["Female", "Male", "?"]
    capital-gain: {type: int, min: 0, max: 99999}
    capital-loss: {type: int, min: 0, max: 4356}
    hours-per-week: {type: int, min: 1, max: 99}
    native-country:
      type: category
      allowed: ["United-States", "Cambodia", "England", "Puerto-Rico", "Canada", "Germany", "Outlying-US(Guam-USVI-etc)", "India", "Japan", "Greece", "South", "China", "Cuba", "Iran", "Honduras", "Philippines", "Italy", "Poland", "Jamaica", "Vietnam", "Mexico", "Portugal", "Ireland", "France", "Dominican-Republic", "Laos", "Ecuador", "Taiwan", "Haiti", "Columbia", "Hungary", "Guatemala", "Nicaragua", "Scotland", "Thailand", "Yugoslavia", "El-Salvador", "Trinadad&Tobago", "Peru", "Hong", "Holand-Netherlands", "?"]
    income:
      type: category
      allowed: ["<=50K", ">50K"]

education_num_map:
  Preschool: 1
  1st-4th: 2
  5th-6th: 3
  7th-8th: 4
  9th: 5
  10th: 6
  11th: 7
  12th: 8
  HS-grad: 9
  Some-college: 10
  Assoc-voc: 11
  Assoc-acdm: 12
  Bachelors: 13
  Masters: 14
  Prof-school: 15
  Doctorate: 16
